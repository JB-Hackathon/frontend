<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Background gradient approximation -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B3A6B"/>
      <stop offset="100%" stop-color="#2C5AA0"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- Decorative arc top-right -->
  <circle cx="380" cy="-20" r="160" fill="white" opacity="0.05"/>
  <circle cx="380" cy="-20" r="110" fill="white" opacity="0.05"/>

  <!-- Decorative arc bottom-left -->
  <circle cx="-20" cy="420" r="180" fill="white" opacity="0.04"/>

  <!-- Logo -->
  <rect x="24" y="24" width="52" height="52" rx="10" fill="white" opacity="0.15"/>
  <text x="50" y="56" font-family="Arial Black,sans-serif" font-size="22" font-weight="900" fill="white" text-anchor="middle">JB</text>

  <!-- Card number -->
  <text x="376" y="44" font-family="Arial,sans-serif" font-size="11" fill="white" opacity="0.4" text-anchor="end">03 / 03</text>

  <!-- Product name -->
  <text x="200" y="150" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="13" fill="white" opacity="0.7" text-anchor="middle">JB은행</text>
  <text x="200" y="182" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="24" font-weight="900" fill="white" text-anchor="middle">주거래 우대 통장</text>

  <!-- Divider -->
  <line x1="100" y1="200" x2="300" y2="200" stroke="white" stroke-width="1" opacity="0.25"/>

  <!-- CTA headline -->
  <text x="200" y="238" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="17" fill="white" opacity="0.9" text-anchor="middle">오늘 바로 시작하세요</text>

  <!-- CTA Button -->
  <rect x="80" y="260" width="240" height="50" rx="25" fill="url(#btnGrad)"/>
  <text x="200" y="291" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="15" font-weight="700" fill="#1B3A6B" text-anchor="middle">JB스마트뱅킹 앱에서 가입</text>

  <!-- QR / App store hint -->
  <rect x="120" y="328" width="68" height="28" rx="6" fill="white" opacity="0.12"/>
  <text x="154" y="346" font-family="Arial,sans-serif" font-size="9" fill="white" text-anchor="middle">App Store</text>

  <rect x="212" y="328" width="68" height="28" rx="6" fill="white" opacity="0.12"/>
  <text x="246" y="346" font-family="Arial,sans-serif" font-size="9" fill="white" text-anchor="middle">Google Play</text>

  <!-- Rate reminder -->
  <text x="200" y="382" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="9" fill="white" opacity="0.4" text-anchor="middle">* 우대금리 7.0%는 우대조건 충족 시 적용됩니다</text>
</svg>
